<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>住院醫師電腦處方教學系統</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- MQTT.js for Real-time Cloud Sync -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
            'pulse-glow': 'pulseGlow 2s infinite',
          },
          keyframes: {
            shake: {
              '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
              '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
              '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
              '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
            },
            pulseGlow: {
              '0%, 100%': { boxShadow: '0 0 0 0 rgba(239, 68, 68, 0.4)' },
              '50%': { boxShadow: '0 0 15px 5px rgba(239, 68, 68, 0.6)' }
            }
          }
        }
      }
    }
  </script>
  <style>
    .fade-in-up {
      animation: fadeInUp 0.4s ease-out forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; border-radius: 4px; }
    
    /* Toast Styles */
    #toastContainer {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .toast {
      background: #1e293b;
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 0.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      transform: translateX(120%);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-left: 5px solid #3b82f6;
      font-size: 0.9rem;
      font-weight: 500;
      min-width: 250px;
    }
    .toast.show { transform: translateX(0); opacity: 1; }
    .toast.success { border-color: #10b981; }
    .toast.error { border-color: #ef4444; }
    .toast.warning { border-color: #f59e0b; }
    .toast.info { border-color: #3b82f6; }
    .shake-err { animation: shake 0.5s; background-color: rgba(239, 68, 68, 0.2) !important; border-color: #ef4444 !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen flex flex-col antialiased">

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- Header -->
  <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-md">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-indigo-500/20 border border-indigo-500/50 rounded-lg text-indigo-400">
        <i data-lucide="monitor" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white flex items-center gap-2">
          住院醫師 CPOE 電腦處方教學系統
          <span id="roleBadge" class="text-[10px] bg-emerald-600 text-white font-mono px-2 py-0.5 rounded uppercase font-bold tracking-widest hidden">學員作答端</span>
        </h1>
        <p class="text-xs text-slate-400 mt-0.5" id="instructorSubtitle">大螢幕投影主控端 / 即時跨裝置互動</p>
      </div>
    </div>

    <!-- Instructor Only Controls -->
    <div id="instructorControls" class="flex items-center gap-2">
      <div class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-mono flex items-center gap-2">
        <i data-lucide="users" class="w-4 h-4 text-emerald-400"></i>
        <span class="text-slate-300">連線學員:</span>
        <span id="connectedCount" class="text-emerald-300 font-bold text-sm">0</span>
      </div>
      <button onclick="openQrModal()" class="flex items-center gap-1.5 text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg transition font-medium shadow-lg shadow-indigo-600/20">
        <i data-lucide="qr-code" class="w-4 h-4"></i> 學員手機掃描
      </button>
      <button onclick="simulateVotes()" class="flex items-center gap-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg transition border border-slate-700" title="單機測試用">
        <i data-lucide="bot" class="w-4 h-4"></i> 模擬20人作答
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 max-w-[1400px] w-full mx-auto p-4 flex flex-col lg:flex-row gap-6 relative">
    
    <!-- LEFT PANEL: Scenarios & Matrix -->
    <div class="flex-1 flex flex-col gap-5 fade-in-up" id="leftPanel">
      
      <!-- Top Alert Banner -->
      <div class="bg-red-950/30 border border-red-500/40 rounded-xl p-3 flex items-center justify-between animate-pulse-glow shadow-lg shadow-red-900/20">
        <div class="flex items-center gap-2">
          <i data-lucide="alert-triangle" class="w-5 h-5 text-red-400"></i>
          <span class="text-sm font-bold text-red-200 tracking-wide">系統警示: 藥物不良反應記錄 (HIS): ENICILLIN、UNKNOWN...</span>
        </div>
      </div>

      <!-- Module Navigation Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-2" id="phaseTabsContainer">
        <!-- Tabs injected by JS -->
      </div>

      <!-- Slide Focus Matrix (Enlarged and Prominent) -->
      <div id="slideMatrixContainer" class="w-full transition-all duration-500">
        <!-- Dynamic Slide Matrix Content -->
      </div>

      <!-- Narrative Question Box -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <h2 id="scenarioTitle" class="text-xl font-bold text-indigo-300 mb-4 flex items-center gap-2">
          <i data-lucide="book-open" class="w-6 h-6"></i> 模組標題
        </h2>
        
        <p id="scenarioNarrative" class="text-lg text-slate-100 leading-relaxed font-medium bg-slate-950/50 p-4 rounded-xl border border-slate-800">
          情境描述內容...
        </p>

        <!-- Vote Options -->
        <div class="mt-6 space-y-3" id="choicesContainer">
          <!-- Options injected by JS -->
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Instructor Stats & Controls -->
    <div class="w-full lg:w-96 flex flex-col gap-4 fade-in-up" id="rightPanel">
      
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl sticky top-20">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-5">
          <h3 class="font-bold text-white text-lg flex items-center gap-2">
            <i data-lucide="bar-chart-2" class="w-6 h-6 text-indigo-400"></i> 即時作答統計
          </h3>
          <span id="pollStatusBadge" class="text-xs font-mono px-2 py-1 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 animate-pulse">作答進行中</span>
        </div>

        <!-- Progress Bars -->
        <div class="space-y-5" id="statsContainer">
          <!-- Stats injected by JS -->
        </div>

        <!-- Instructor Action Buttons -->
        <div class="mt-8 space-y-3" id="instructorActions">
          <button onclick="togglePollState()" id="togglePollBtn" class="w-full py-3 rounded-xl font-bold text-[15px] transition flex items-center justify-center gap-2 bg-amber-600 hover:bg-amber-500 text-white shadow-lg shadow-amber-900/30">
            <i data-lucide="pause-circle" class="w-5 h-5"></i> 暫停作答，公佈統計與解答
          </button>
          
          <button onclick="nextScenario()" id="nextScenarioBtn" class="w-full py-3 rounded-xl font-bold text-[15px] transition flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-900/30 hidden">
            <i data-lucide="arrow-right-circle" class="w-5 h-5"></i> 解說完畢，前進下一題
          </button>
        </div>

        <!-- Pearl Box (Hidden during active poll) -->
        <div id="pearlBox" class="mt-6 p-5 bg-slate-800/80 border-2 border-indigo-500/50 rounded-xl hidden shadow-2xl">
          <h4 class="font-bold text-indigo-300 text-base mb-3 flex items-center gap-2 border-b border-indigo-500/30 pb-2">
            <i data-lucide="lightbulb" class="w-5 h-5"></i> 藥師 / 系統防錯解析
          </h4>
          <p id="pearlContent" class="text-[15px] text-slate-200 leading-relaxed font-medium"></p>
        </div>
      </div>

    </div>
  </main>

  <!-- MODAL: QR Code for Students -->
  <div id="qrModal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full p-8 shadow-2xl text-center relative">
      <button onclick="closeQrModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white transition">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
      
      <h3 class="font-bold text-2xl text-white mb-3">學員掃描即時作答</h3>
      <p class="text-sm text-slate-400 mb-6 leading-relaxed">請學員開啟相機掃描下方 QR Code，不需下載 App 即可進入作答畫面。作答結果將與大螢幕<span class="text-emerald-400 font-bold"> 0.1 秒即時同步</span>。</p>
      
      <div class="bg-white p-5 rounded-2xl inline-block mx-auto mb-6 shadow-lg" id="qrcodeCanvas"></div>
      
      <div class="mt-2 p-4 bg-slate-950 border border-slate-800 rounded-xl text-left shadow-inner">
        <label class="text-xs text-amber-400 font-bold mb-2 block flex items-center gap-1">
          <i data-lucide="info" class="w-4 h-4"></i> 若手機掃描顯示找不到網頁 (需自訂網址)：
        </label>
        <div class="flex gap-2">
          <input type="text" id="customUrlInput" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:border-indigo-500 outline-none transition" placeholder="請輸入您部署後的 GitHub Pages 網址...">
          <button onclick="updateQrCode()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition shadow-lg">更新 QR</button>
        </div>
      </div>
    </div>
  </div>

  <!-- APPLICATION JAVASCRIPT LOGIC -->
  <script>
    // === SCENARIO DATA DEFINITION (10 Deep Modules) ===
    const scenarios = [
      {
        title: "【模組一】藥品搜尋與防錯機制",
        pptRef: "PPT Page 4-7, 11",
        narrative: "您準備開立 SGLT-2 抑制劑降血糖藥物，但不確定『Dapagliflozin』中間的拼法，且擔心開錯成相似字首的藥品。下列哪一種搜尋與辨識方式『最安全且有效』？",
        slideMatrix: `<div class="bg-indigo-950/60 border-l-4 border-indigo-500 p-6 rounded-r-2xl mb-4 shadow-xl">
            <h3 class="text-xl font-bold text-indigo-300 mb-4 border-b border-indigo-500/30 pb-2">📊 核心看板：藥名建檔與防錯</h3>
            <ul class="space-y-4 text-lg text-slate-200">
              <li class="flex gap-3 items-start"><i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-400 shrink-0 mt-0.5"></i><div><span class="text-indigo-400 font-bold">1. 萬用字元：</span>輸入 <code class="bg-slate-900 px-2 py-0.5 rounded text-amber-300 border border-slate-700 shadow-inner">%gliflo</code> 可搜尋非字首關鍵字。</div></li>
              <li class="flex gap-3 items-start"><i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-400 shrink-0 mt-0.5"></i><div><span class="text-indigo-400 font-bold">2. 藥理分類防錯：</span>系統依分類分群 (如 Misc. Analgesics vs Anticonvulsants) 預防 LASA 相似藥誤開。</div></li>
              <li class="flex gap-3 items-start"><i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-400 shrink-0 mt-0.5"></i><div><span class="text-indigo-400 font-bold">3. 藥品手冊查詢：</span>點選前方 📖 圖示，可查看外觀、仿單及健保規範。</div></li>
            </ul>
          </div>`,
        choices: {
          A: { text: "隨便輸入前三個字母，從下拉清單盲猜挑選", isCorrect: false },
          B: { text: "使用萬用字元（如輸入 %gliflo）搜尋，並透過系統提示的『藥理分類』與前方『藥品手冊圖示』雙重確認", isCorrect: true },
          C: { text: "直接打電話給藥局詢問藥碼，不使用系統搜尋功能", isCorrect: false },
          D: { text: "先開立其他降血糖藥替代，等藥師來照會再改", isCorrect: false }
        },
        pearl: "【系統防呆解析】系統具備強大防錯機制！不確定拼法時善用 '%' 萬用字元。同成分、不同劑型或廠牌的藥品，開立時務必核對系統的「藥理分類提示」與「螢幕名」防呆，避免將營養劑 Dipeptiven 誤開為抗癲癇藥 Depavent！"
      },
      {
        title: "【模組一】螢幕名特殊註記判讀",
        pptRef: "PPT Page 4-5",
        narrative: "在開方系統中，您看到一筆藥品的螢幕名標示為『(口)(CDC) Eraflu cap 75mg』以及另一筆『($) Eraflu cap 75mg』。關於螢幕名前方的特殊註記，下列解讀何者正確？",
        slideMatrix: `<div class="bg-indigo-950/60 border-l-4 border-indigo-500 p-6 rounded-r-2xl mb-4 shadow-xl">
            <h3 class="text-xl font-bold text-indigo-300 mb-4 border-b border-indigo-500/30 pb-2">📊 核心看板：螢幕名標記原則</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 shadow-md">
                <div class="text-emerald-400 font-bold mb-2">💊 途徑標記</div>
                <div class="text-slate-300">(口) 口服<br>(針) 針劑</div>
              </div>
              <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 shadow-md">
                <div class="text-emerald-400 font-bold mb-2">🏢 廠牌標記</div>
                <div class="text-slate-300">(生達) 標示特定<br>學名藥廠牌</div>
              </div>
              <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 shadow-md">
                <div class="text-emerald-400 font-bold mb-2">💰 計價標記</div>
                <div class="text-slate-300">($) 代表自費<br>(CDC) 疾管署專案</div>
              </div>
            </div>
          </div>`,
        choices: {
          A: { text: "($) 代表健保給付，(CDC) 代表該藥物為癌症專用", isCorrect: false },
          B: { text: "(口) 代表口服，($) 代表自費，(CDC) 代表公費/疾病管制署身分，可避免開錯計價身分", isCorrect: true },
          C: { text: "螢幕名前方的字眼不具臨床意義，只是一般備註", isCorrect: false },
          D: { text: "(口) 代表需在口腔內含服，不可吞下", isCorrect: false }
        },
        pearl: "【系統防呆解析】螢幕名 (Screen Name) 是防錯的第一道防線！同成分可能因給藥途徑、計價身分 (自費/公費) 或特定廠牌而有不同螢幕名。準確辨識可大幅減少退藥與帳務錯誤。"
      },
      {
        title: "【模組二】醫囑給藥與停用 (DC) 時間地雷",
        pptRef: "PPT Page 10, 13",
        narrative: "您準備將病人原有的 Q8H 抗生素停用。系統預設的常規給藥時間點為 09:00、17:00、01:00。為了確保護理師『不會』在早上 09:00 再給一次藥，您應該如何設定停用 (DC) 時間？",
        slideMatrix: `<div class="bg-rose-950/40 border-l-4 border-rose-500 p-6 rounded-r-2xl mb-4 shadow-xl">
            <h3 class="text-xl font-bold text-rose-300 mb-4 border-b border-rose-500/30 pb-2">🚨 核心看板：發藥入帳地雷法則</h3>
            <div class="bg-slate-950 p-5 rounded-xl border border-rose-500/50">
              <div class="text-rose-400 font-bold text-xl mb-3 flex items-center gap-2"><i data-lucide="bomb" class="w-6 h-6"></i> 絕對地雷：DC 在整點時間上！</div>
              <ul class="space-y-3 text-lg text-slate-300 font-medium">
                <li class="flex items-center gap-2"><i data-lucide="check" class="text-emerald-500"></i> 生效時間落於時間點 ➔ <span class="text-emerald-400">會入帳、會發藥</span></li>
                <li class="flex items-center gap-2"><i data-lucide="x" class="text-rose-500"></i> DC 時間落於時間點 ➔ <span class="text-rose-400">不會入帳、不會發藥</span></li>
              </ul>
              <div class="mt-4 p-3 bg-amber-950/50 rounded-lg text-amber-300 text-sm">⚠️ 嚴重後果：若護理已給藥，但醫師設定 DC 剛好在給藥點，將造成護理端漏給藥與藥局帳務混亂！</div>
            </div>
          </div>`,
        choices: {
          A: { text: "直接設定 DC 時間為 09:00 整", isCorrect: false },
          B: { text: "設定 DC 時間為 08:59 以前 (例如 08:00)，避開常規時間點", isCorrect: true },
          C: { text: "設定 DC 時間為 09:01，讓藥局有緩衝時間", isCorrect: false },
          D: { text: "不需設定 DC，在備註欄寫『早上不用給』即可", isCorrect: false }
        },
        pearl: "【系統防呆解析】停用時間若剛好落於給藥時間點上，系統邏輯將判定『不發藥/不入帳』！若實際護理端已經給藥，會造成帳務與庫存錯誤。好習慣：避開整點，提早 DC！"
      },
      {
        title: "【模組二】不規則頻次推算 (QW / Q2D)",
        pptRef: "PPT Page 34",
        narrative: "您於『週三』開立一筆 QW (每週一次) 的特殊用藥，但『並未勾選首劑』，且該頻次預設給藥日為『週一』。系統對下一次給藥時間的判定為何？",
        slideMatrix: `<div class="bg-indigo-950/60 border-l-4 border-indigo-500 p-6 rounded-r-2xl mb-4 shadow-xl">
            <h3 class="text-xl font-bold text-indigo-300 mb-4 border-b border-indigo-500/30 pb-2">📊 核心看板：不規則頻次週期</h3>
            <ul class="space-y-4 text-lg text-slate-200">
              <li class="flex gap-3 items-start"><i data-lucide="calendar" class="w-6 h-6 text-amber-400 shrink-0 mt-0.5"></i><div><span class="text-amber-400 font-bold">Q(N)W 週期：</span>若當日不給首劑，下次給藥時間是<strong class="text-rose-400">下週同一天</strong>，而非次日。</div></li>
              <li class="flex gap-3 items-start"><i data-lucide="calendar" class="w-6 h-6 text-amber-400 shrink-0 mt-0.5"></i><div><span class="text-amber-400 font-bold">Q2D/Q3D 週期：</span>若錯過給藥時間點未勾首劑，下一個給藥點是<strong class="text-rose-400">明天</strong>。</div></li>
              <li class="flex gap-3 items-start"><i data-lucide="alert-circle" class="w-6 h-6 text-indigo-400 shrink-0 mt-0.5"></i><div><span class="text-indigo-400 font-bold">防錯提醒：</span>首劑時間必須與指定星期吻合，否則系統會跳出不合法檢核！</div></li>
            </ul>
          </div>`,
        choices: {
          A: { text: "系統會自動判定為明天 (週四) 給藥", isCorrect: false },
          B: { text: "系統會判定為下週一給藥，若病患今日急需，應勾選『首劑』或確認生效日", isCorrect: true },
          C: { text: "處方會直接作廢被系統刪除", isCorrect: false },

    let currentVotes = { A: 0, B: 0, C: 0, D: 0 };
    let connectedStudents = new Set();

    function showToast(message, type = "info") {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let icon = '<i data-lucide="info" class="w-5 h-5"></i>';
      if(type === 'success') icon = '<i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>';
      if(type === 'warning') icon = '<i data-lucide="alert-triangle" class="w-5 h-5 text-amber-400"></i>';
      if(type === 'error') icon = '<i data-lucide="x-circle" class="w-5 h-5 text-rose-400"></i>';

      toast.className = `toast flex items-center gap-3 ${type}`;
      toast.innerHTML = `${icon} <span class="flex-1">${message}</span>`;
      
      container.appendChild(toast);
      lucide.createIcons();

      // Trigger animation
      setTimeout(() => toast.classList.add('show'), 10);

      // Remove after 3s
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, 3000);
    }

    function processSyncMessage(topic, data) {
      if (appRole === "instructor") {
        if (topic === `${mqttTopicPrefix}/votes` && data.scenarioIdx === currentScenarioIdx) {
          currentVotes[data.choice] = (currentVotes[data.choice] || 0) + 1;
          connectedStudents.add(data.uuid);
          updateVoteStatsUI();
          updateConnectedCount();
        } else if (topic === `${mqttTopicPrefix}/join`) {
          connectedStudents.add(data.uuid);
          updateConnectedCount();
          broadcastState(); 
        }
      } else if (appRole === "student" && topic === `${mqttTopicPrefix}/state`) {
        if (data.scenarioIdx !== undefined && data.scenarioIdx !== currentScenarioIdx) {
          currentScenarioIdx = data.scenarioIdx;
          renderScenario(currentScenarioIdx);
        }
        if (data.pollActive !== undefined && data.pollActive !== pollActive) {
          pollActive = data.pollActive;
          updatePollStateUI();
        }
      }
    }

    function publishSyncMessage(topic, data) {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(topic, JSON.stringify(data), { retain: topic.endsWith('/state') });
      } else if (localChannel) {
        localChannel.postMessage({ topic: topic, data: data });
      }
    }

    function initMqttSync() {
      // 1. 本機備援廣播通道 (解決 Canvas 沙盒阻擋連線的問題)
      if (window.BroadcastChannel) {
        localChannel = new BroadcastChannel(mqttTopicPrefix);
        localChannel.onmessage = (event) => {
          processSyncMessage(event.data.topic, event.data.data);
        };
      }

      // 2. 雲端 MQTT (部署至 GitHub 後發揮作用)
      try {

        mqttClient.on('error', (err) => {
          console.warn("系統提醒: 預覽環境阻擋外部連線 (Canvas CSP)，已自動切換為本機跨分頁模式。部署至 GitHub Pages 後將自動恢復雲端連線。");
        });

        mqttClient.on('connect', () => {
          console.log("✅ Cloud Sync Connected!");
          if (appRole === "instructor") {
            mqttClient.subscribe(`${mqttTopicPrefix}/votes`);
            mqttClient.subscribe(`${mqttTopicPrefix}/join`);
            broadcastState();
          } else {
            mqttClient.subscribe(`${mqttTopicPrefix}/state`);
            publishSyncMessage(`${mqttTopicPrefix}/join`, { uuid: currentUserUuid });

          try {

            processSyncMessage(topic, data);
          } catch (e) {
            console.error("Sync Parse Error:", e);
          }
        });
      } catch (err) {
        console.warn("MQTT Init Failed (Canvas Blocked), running in Local Mode");
      }
    }

    function broadcastState() {
      if (appRole === "instructor") {
        publishSyncMessage(`${mqttTopicPrefix}/state`, {
          scenarioIdx: currentScenarioIdx,
          pollActive: pollActive
        });
      }
    }

    function updateConnectedCount() {
      document.getElementById('connectedCount').innerText = connectedStudents.size;
    }

    function setAppRole(role) {
      appRole = role;
      if (appRole === "student") {
        document.getElementById("instructorControls").style.display = "none";
        document.getElementById("rightPanel").style.display = "none";
        document.getElementById("phaseTabsContainer").style.display = "none";
        document.getElementById("instructorSubtitle").style.display = "none";
        
        const badge = document.getElementById("roleBadge");
        badge.style.display = "inline-block";
        
        document.getElementById("leftPanel").classList.replace("lg:max-w-3xl", "max-w-3xl");
        document.getElementById("leftPanel").classList.add("mx-auto");
      }
    }

    function initPhaseTabs() {
      const container = document.getElementById("phaseTabsContainer");
      container.innerHTML = "";
      scenarios.forEach((sc, idx) => {
        const btn = document.createElement("button");
        btn.id = `phaseBtn_${idx}`;
        btn.className = `whitespace-nowrap px-4 py-2 rounded-xl border-2 font-bold text-sm transition flex items-center gap-2 ${idx === currentScenarioIdx ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg shadow-indigo-500/40' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white hover:bg-slate-700'}`;
        btn.innerHTML = `<span class="w-2.5 h-2.5 rounded-full ${idx === currentScenarioIdx ? 'bg-white animate-pulse' : 'bg-slate-600'}"></span> 題 ${idx+1}`;
        btn.onclick = () => changeScenario(idx);
        container.appendChild(btn);
      });
    }

    window.changeScenario = function(idx) {
      currentScenarioIdx = idx;
      pollActive = true;
      
      // ✅ 強制清空上一題作答紀錄
      currentVotes = { A: 0, B: 0, C: 0, D: 0 }; 
      
      initPhaseTabs();
      renderScenario(idx);
      updatePollStateUI();
      broadcastState(); 
    };

    window.nextScenario = function() {
      if (currentScenarioIdx < scenarios.length - 1) {
        changeScenario(currentScenarioIdx + 1);
      } else {
        showToast("課程已全部結束！感謝參與", "success");
        fireConfetti();
      }
    }

    function renderScenario(idx) {
      const sc = scenarios[idx];
      document.getElementById("scenarioTitle").innerHTML = `<i data-lucide="book-open" class="w-6 h-6 text-indigo-400"></i> ${sc.title} <span class="text-sm bg-slate-800 px-3 py-1 rounded border border-slate-700 text-slate-300 ml-3 font-mono shadow-inner">${sc.pptRef}</span>`;
      document.getElementById("scenarioNarrative").innerText = sc.narrative;
      document.getElementById("slideMatrixContainer").innerHTML = sc.slideMatrix;
      
      const pearlBox = document.getElementById("pearlBox");
      if(pearlBox) pearlBox.classList.add("hidden");
      document.getElementById("pearlContent").innerText = sc.pearl;

      const choicesContainer = document.getElementById("choicesContainer");
      choicesContainer.innerHTML = "";
      
      ['A', 'B', 'C', 'D'].forEach(key => {
        if (!sc.choices[key]) return;
        const btn = document.createElement("button");
        btn.id = `choiceBtn_${key}`;
        btn.className = "w-full text-left px-5 py-4 rounded-xl border-2 border-slate-700 bg-slate-800/80 hover:bg-slate-700 hover:border-indigo-400 transition flex items-start gap-4 group shadow-md";
        btn.innerHTML = `
          <div class="w-10 h-10 rounded-lg bg-slate-700 text-white text-lg font-bold flex items-center justify-center shrink-0 group-hover:bg-indigo-500 group-hover:scale-110 transition shadow-md">${key}</div>
          <div class="text-slate-200 font-medium text-base sm:text-lg pt-1.5">${sc.choices[key].text}</div>
        `;
        btn.onclick = () => handleVote(key, btn);
        choicesContainer.appendChild(btn);
      });

      updateVoteStatsUI();
      lucide.createIcons();
      
      document.getElementById("leftPanel").classList.remove("fade-in-up");
      void document.getElementById("leftPanel").offsetWidth; 
      document.getElementById("leftPanel").classList.add("fade-in-up");
    }

    window.handleVote = function(choiceKey, btnElement) {
      if (!pollActive) {
        showToast("本題作答已鎖定", "warning");
        return;
      }

      // 視覺回饋: 學生端點擊
      if(appRole === 'student' && btnElement) {
        ['A','B','C','D'].forEach(k => {
          let b = document.getElementById(`choiceBtn_${k}`);
          if(b) b.classList.replace('border-indigo-500', 'border-slate-700');
        });
        btnElement.classList.replace('border-slate-700', 'border-indigo-500');
        btnElement.classList.add('bg-indigo-900/40');
      }

      publishSyncMessage(`${mqttTopicPrefix}/votes`, {
        scenarioIdx: currentScenarioIdx,
        choice: choiceKey,
        uuid: currentUserUuid
      });
      showToast(`已傳送: 選項 ${choiceKey}`, "success");

      // 單機離線防呆處理
      if (appRole === "instructor" && (!mqttClient || !mqttClient.connected)) {
        currentVotes[choiceKey]++;
        updateVoteStatsUI();
      }
    };

    function updateVoteStatsUI() {
      if (appRole !== "instructor") return;
      const container = document.getElementById("statsContainer");
      container.innerHTML = "";
      
      let total = Object.values(currentVotes).reduce((a, b) => a + b, 0);
      const sc = scenarios[currentScenarioIdx];

      ['A', 'B', 'C', 'D'].forEach(key => {
        if (!sc.choices[key]) return;
        const count = currentVotes[key] || 0;
        const pct = total === 0 ? 0 : Math.round((count / total) * 100);
        
        const isRevealedAndCorrect = !pollActive && sc.choices[key].isCorrect;
        const isRevealedAndWrong = !pollActive && !sc.choices[key].isCorrect;

        let barColor = "bg-indigo-500";
        let labelColor = "text-slate-300";
        
        if (isRevealedAndCorrect) {
          barColor = "bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.5)]";
          labelColor = "text-emerald-400 font-bold text-lg";
        } else if (isRevealedAndWrong) {
          barColor = "bg-slate-600";
          labelColor = "text-slate-500";
        }

        container.innerHTML += `
          <div class="transition-all duration-300">
            <div class="flex justify-between text-sm mb-1.5 ${labelColor}">
              <span class="truncate pr-4">${key}. ${sc.choices[key].text}</span>
              <span class="font-mono font-bold shrink-0">${count} 票 (${pct}%)</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-3.5 overflow-hidden shadow-inner border border-slate-700">
              <div class="${barColor} h-3.5 rounded-full transition-all duration-700 ease-out" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      });
    }

    window.togglePollState = function() {
      pollActive = !pollActive;
      updatePollStateUI();
      broadcastState(); 
      
      if (!pollActive) {
        revealAnswerToInstructor();
      }
    };

    function updatePollStateUI() {
      if (appRole === "instructor") {
        const btn = document.getElementById("togglePollBtn");
        const nextBtn = document.getElementById("nextScenarioBtn");
        const badge = document.getElementById("pollStatusBadge");
        
        if (pollActive) {
          btn.innerHTML = `<i data-lucide="pause-circle" class="w-5 h-5"></i> 暫停作答，公佈統計與解答`;
          btn.className = "w-full py-3 rounded-xl font-bold text-[15px] transition flex items-center justify-center gap-2 bg-amber-600 hover:bg-amber-500 text-white shadow-lg shadow-amber-900/30";
          nextBtn.classList.add("hidden");
          badge.innerText = "作答進行中";
          badge.className = "text-xs font-mono px-2 py-1 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 animate-pulse";
          document.getElementById("pearlBox").classList.add("hidden");
        } else {
          btn.innerHTML = `<i data-lucide="play-circle" class="w-5 h-5"></i> 重新開放作答`;
          btn.className = "w-full py-3 rounded-xl font-bold text-[15px] transition flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 text-white border border-slate-600";
          nextBtn.classList.remove("hidden");
          badge.innerText = "作答已鎖定";
          badge.className = "text-xs font-mono px-2 py-1 rounded-md bg-rose-500/20 text-rose-400 border border-rose-500/40";
        }
        updateVoteStatsUI(); 
        lucide.createIcons();
      } else {
        const choicesContainer = document.getElementById("choicesContainer");
        if (!pollActive) {
          choicesContainer.style.opacity = "0.5";
          choicesContainer.style.pointerEvents = "none";
          showToast("講師已結算本題統計", "info");
          
          // 若學生答錯，給予震動提示 (Visual check on student side)
          const sc = scenarios[currentScenarioIdx];
          let correctKey = Object.keys(sc.choices).find(k => sc.choices[k].isCorrect);
          ['A','B','C','D'].forEach(k => {
             let btn = document.getElementById(`choiceBtn_${k}`);
             if(btn && btn.classList.contains('border-indigo-500') && k !== correctKey) {
                 btn.classList.add('shake-err');
             } else if (btn && k === correctKey) {
                 btn.classList.replace('border-slate-700', 'border-emerald-500');
                 btn.classList.add('bg-emerald-900/30');
             }
          });

        } else {
          choicesContainer.style.opacity = "1";
          choicesContainer.style.pointerEvents = "auto";
          ['A','B','C','D'].forEach(k => {
             let btn = document.getElementById(`choiceBtn_${k}`);
             if(btn) btn.className = "w-full text-left px-5 py-4 rounded-xl border-2 border-slate-700 bg-slate-800/80 hover:bg-slate-700 hover:border-indigo-400 transition flex items-start gap-4 group shadow-md";
          });
        }
      }
    }

    function revealAnswerToInstructor() {
      const sc = scenarios[currentScenarioIdx];
      const pearlBox = document.getElementById("pearlBox");
      pearlBox.classList.remove("hidden");
      pearlBox.classList.add("fade-in-up");
      
      let correctKey = Object.keys(sc.choices).find(k => sc.choices[k].isCorrect);
      let total = Object.values(currentVotes).reduce((a, b) => a + b, 0);
      let correctVotes = currentVotes[correctKey] || 0;
      
      // 答對率超過 50% 觸發慶祝彩花
      if (total > 0 && (correctVotes / total) > 0.5) {
        fireConfetti();
      }
    }

    function fireConfetti() {
      var duration = 2000;
      var animationEnd = Date.now() + duration;
      var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000 };

      function randomInRange(min, max) { return Math.random() * (max - min) + min; }

      var interval = setInterval(function() {
        var timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) { return clearInterval(interval); }
        var particleCount = 50 * (timeLeft / duration);
        confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
        confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
      }, 250);
    }

    let qrcode = null;
    function buildStudentJoinUrl(rawUrl) {
      const source = (rawUrl || window.location.href).trim();
      const normalized = new URL(source, window.location.href);
      normalized.search = "";
      normalized.hash = "";
      normalized.searchParams.set("role", "student");
      return normalized.href;
    }

    function ensureQrCode() {
      if (!qrcode) {
        qrcode = new QRCode(document.getElementById("qrcodeCanvas"), {
          width: 220,
          height: 220,
          colorDark : "#0f172a",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.H
        });
      }
    }

    window.openQrModal = function() {
      document.getElementById('qrModal').classList.remove('hidden');

      const currentUrl = window.location.href;
      if(currentUrl.includes('blob:') || currentUrl.includes('localhost') || currentUrl.includes('file://')) {
        showToast("警告：目前為本機或預覽網址，手機可能無法直接連線。請自訂 Github 網址更新 QR。", "warning");
      }

      ensureQrCode();
      qrcode.clear();
      qrcode.makeCode(buildStudentJoinUrl(currentUrl));
    }

    window.closeQrModal = function() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    window.updateQrCode = function() {
      let customUrl = document.getElementById('customUrlInput').value.trim();
      if(customUrl) {
        ensureQrCode();
        qrcode.clear();
        qrcode.makeCode(buildStudentJoinUrl(customUrl));
        showToast("QR Code 已成功更新為自訂網址", "success");
      } else {
        showToast("請輸入有效的網址", "error");
      }
    }

    window.simulateVotes = function() {
      if(!pollActive) return;
      const sc = scenarios[currentScenarioIdx];
      let correctKey = Object.keys(sc.choices).find(k => sc.choices[k].isCorrect);
      
      for(let i=0; i<20; i++) {
        setTimeout(() => {
          let keys = Object.keys(sc.choices);
          // 模擬較高答對率，但混雜錯誤答案
          let voteKey = Math.random() > 0.35 ? correctKey : keys[Math.floor(Math.random() * keys.length)];
          
          currentVotes[voteKey]++;
          connectedStudents.add('sim_'+i);
          updateConnectedCount();
          updateVoteStatsUI();
        }, i * 120); 
      }
      showToast("模擬 20 名學員湧入作答中...", "info");
    }

    // Initialize Application
    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      initPhaseTabs();
      
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("role") === "student") {
        setAppRole("student");
      }
      
      renderScenario(currentScenarioIdx);
      initMqttSync();
    });
  </script>
</body>
</html>
